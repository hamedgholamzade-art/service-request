<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بازیابی کد پیگیری</title><link rel="stylesheet" href="style.css"></head><body><div class="container"><div class="card"><h2>🆔 بازیابی کد پیگیری</h2><p>هر سه اطلاعات را دقیقاً مانند زمان ثبت درخواست وارد کنید.</p><input id="name" placeholder="نام و نام خانوادگی"><input id="mobile" placeholder="شماره موبایل"><input id="service" placeholder="نوع خدمت"><button class="btn green" onclick="recover()">بازیابی کد پیگیری</button><div id="r"></div></div></div><script src="config.js"></script><script>async function recover(){try{const x=await fetch(APP_CONFIG.recoverApi,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name.value.trim(),mobile:mobile.value.trim(),service:service.value.trim()})});const j=await x.json();if(!j.found)throw Error(j.message||"درخواستی با این مشخصات پیدا نشد.");r.innerHTML='<div class="result">کد پیگیری شما: <b>'+j.tracking_code+'</b><br><br><a class="btn" href="track.html?code='+encodeURIComponent(j.tracking_code)+'">رفتن به صفحه پیگیری</a></div>'}catch(e){r.innerHTML='<div class="result">'+e.message+'</div>'}}</script></body></html>
