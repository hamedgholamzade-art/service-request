<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پنل مدیریت درخواست‌ها</title>

<style>

body{
font-family:tahoma;
background:#f5f5f5;
padding:20px;
}

.box{
background:white;
padding:20px;
border-radius:10px;
max-width:1200px;
margin:auto;
}

h2{
text-align:center;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
border:1px solid #ccc;
padding:10px;
text-align:center;
}

th{
background:#eee;
}

</style>

</head>


<body>


<div class="box">

<h2>پنل مدیریت درخواست‌ها</h2>


<table>

<thead>

<tr>

<th>کد پیگیری</th>
<th>نام</th>
<th>موبایل</th>
<th>خدمت</th>
<th>وضعیت</th>
<th>قیمت</th>

</tr>

</thead>


<tbody id="table">

<tr>
<td colspan="6">
در حال دریافت اطلاعات...
</td>
</tr>

</tbody>


</table>


</div>



<script>


const API_URL = "https://hamedgholamzade.app.n8n.cloud/webhook/admin-list";



fetch(API_URL)

.then(response => response.json())

.then(result => {


console.log(result);


// چون خروجی n8n شما مستقیم آرایه است

let rows = Array.isArray(result) ? result : result.data;



let html = "";



if(!rows || rows.length === 0){


html = 

<tr>

<td colspan="6">

اطلاعاتی موجود نیست

</td>

</tr>

;

}


else{


rows.forEach(item => {


html += 

<tr>

<td>${item.tracking_code || ""}</td>

<td>${item.name || ""}</td>

<td>${item.mobile || ""}</td>

<td>${item.service || ""}</td>

<td>${item.status || ""}</td>

<td>${item.price || ""}</td>

</tr>

;


});


}



document.getElementById("table").innerHTML = html;



})



.catch(error => {


console.log(error);


document.getElementById("table").innerHTML = 

<tr>

<td colspan="6">

خطا در دریافت اطلاعات

</td>

</tr>

;


});



</script>


</body>

</html>
