<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>پنل مدیریت درخواست‌ها</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<div class="card">
<div class="header">
<h1>پنل مدیریت درخواست‌ها</h1>
<p>مشاهده و ویرایش درخواست‌های ثبت‌شده</p>
</div>

<div id="loadStatus" class="status"></div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>کد پیگیری</th><th>نام</th><th>موبایل</th><th>خدمت</th>
<th>وضعیت</th><th>قیمت</th><th>پاسخ</th><th>عملیات</th>
</tr>
</thead>
<tbody id="tableBody">
<tr><td colspan="8">در حال دریافت اطلاعات...</td></tr>
</tbody>
</table>
</div>

<div id="editBox" class="edit-box">
<h3>ویرایش درخواست</h3>

<input type="hidden" id="tracking_code">

<label for="status">وضعیت</label>
<select id="status">
<option value="جدید">جدید</option>
<option value="در حال بررسی">در حال بررسی</option>
<option value="انجام شد">انجام شد</option>
<option value="رد شد">رد شد</option>
</select>

<label for="price">قیمت</label>
<input id="price" type="text" inputmode="numeric">

<label for="reply">پاسخ مدیر</label>
<textarea id="reply"></textarea>

<div class="actions">
<button class="primary" id="saveBtn" type="button">ذخیره تغییرات</button>
<button class="secondary" id="cancelBtn" type="button">انصراف</button>
</div>

<div id="saveStatus" class="status"></div>
</div>
</div>
</div>

<script src="config.js"></script>
<script>
"use strict";

const body=document.getElementById("tableBody");
const editBox=document.getElementById("editBox");
const loadStatus=document.getElementById("loadStatus");
const saveStatus=document.getElementById("saveStatus");
const saveBtn=document.getElementById("saveBtn");
const cancelBtn=document.getElementById("cancelBtn");

let rows=[];

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function status(el,msg,type){
 el.textContent=msg||"";
 el.className="status "+(type||"");
}
function extractRows(result){
 if(Array.isArray(result))return result;
 if(result&&Array.isArray(result.data))return result.data;
 if(result&&Array.isArray(result.items))return result.items;
 if(result&&Array.isArray(result.rows))return result.rows;
 return [];
}

async function loadRequests(){
 body.innerHTML='<tr><td colspan="8">در حال دریافت اطلاعات...</td></tr>';
 status(loadStatus,"","");
 try{
  if(!APP_CONFIG.listApi)throw new Error("listApi در config.js تنظیم نشده است.");

  const r=await fetch(APP_CONFIG.listApi,{
   method:"GET",cache:"no-store",headers:{"Accept":"application/json"}
  });
  const text=await r.text();
  if(!r.ok)throw new Error("HTTP "+r.status);

  let result;
  try{result=JSON.parse(text)}catch(_){throw new Error("پاسخ admin-list JSON معتبر نیست.")}

  rows=extractRows(result);

  if(!rows.length){
   body.innerHTML='<tr><td colspan="8">درخواستی وجود ندارد.</td></tr>';
   return;
  }

  body.innerHTML=rows.map((item,i)=>`
   <tr>
    <td>${esc(item.tracking_code)}</td>
    <td>${esc(item.name)}</td>
    <td>${esc(item.mobile)}</td>
    <td>${esc(item.service)}</td>
    <td>${esc(item.status)}</td>
    <td>${esc(item.price)}</td>
    <td>${esc(item.reply)}</td>
    <td><button class="primary editBtn" type="button" data-index="${i}">ویرایش</button></td>
   </tr>
  `).join("");

  status(loadStatus,"تعداد "+rows.length+" درخواست دریافت شد.","ok");
 }catch(err){
  body.innerHTML='<tr><td colspan="8">خطا در دریافت اطلاعات.</td></tr>';
  status(loadStatus,err.message||"خطای دریافت اطلاعات.","err");
  console.error(err);
 }
}

body.addEventListener("click",e=>{
 const btn=e.target.closest(".editBtn");
 if(!btn)return;

 const item=rows[Number(btn.dataset.index)];
 if(!item)return;

 const code=String(item.tracking_code??"").trim();
 if(!code){
  alert("کد پیگیری این درخواست وجود ندارد.");
  return;
 }

 document.getElementById("tracking_code").value=code;
 document.getElementById("status").value=item.status||"جدید";
 document.getElementById("price").value=item.price??"";
 document.getElementById("reply").value=item.reply??"";

 status(saveStatus,"","");
 editBox.classList.add("show");
 editBox.scrollIntoView({behavior:"smooth",block:"center"});
});

cancelBtn.addEventListener("click",()=>{
 editBox.classList.remove("show");
 status(saveStatus,"","");
});

saveBtn.addEventListener("click",async()=>{
 saveBtn.disabled=true;
 status(saveStatus,"در حال ذخیره تغییرات...","");

 try{
  const trackingCode=document.getElementById("tracking_code").value.trim();
  if(!trackingCode)throw new Error("کد پیگیری این درخواست وجود ندارد.");
  if(!APP_CONFIG.updateApi)throw new Error("updateApi در config.js تنظیم نشده است.");

  /*
   * مهم:
   * در workflow فعلی n8n، Update row in sheet
   * بر اساس tracking_code جستجو می‌کند.
   */
  const data={
   tracking_code:trackingCode,
   status:document.getElementById("status").value,
   price:document.getElementById("price").value,
   reply:document.getElementById("reply").value,
   admin_note:"ویرایش از پنل مدیریت"
  };

  const r=await fetch(APP_CONFIG.updateApi,{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "Accept":"application/json"
   },
   body:JSON.stringify(data)
  });

  const text=await r.text();
  if(!r.ok)throw new Error("HTTP "+r.status+(text?" - "+text:""));

  status(saveStatus,"اطلاعات با موفقیت ذخیره شد.","ok");
  alert("اطلاعات با موفقیت ذخیره شد.");
  editBox.classList.remove("show");
  await loadRequests();

 }catch(err){
  status(saveStatus,"خطا در ذخیره اطلاعات: "+err.message,"err");
  alert("خطا در ذخیره اطلاعات: "+err.message);
  console.error(err);
 }finally{
  saveBtn.disabled=false;
 }
});

loadRequests();
</script>
</body>
</html>
