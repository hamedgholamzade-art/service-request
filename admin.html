<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پنل مدیریت درخواست‌ها</title>

<style>

body{
    font-family:tahoma;
    background:#f4f6f8;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px #ddd;
}

h2{
    text-align:center;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ddd;
    padding:12px;
    text-align:center;
}

th{
    background:#eeeeee;
}

.loading{
    text-align:center;
    padding:20px;
}

</style>

</head>


<body>


<div class="container">

<h2>
پنل مدیریت درخواست‌ها
</h2>


<table>

<thead>

<tr>

<th>کد پیگیری</th>
<th>نام</th>
<th>موبایل</th>
<th>خدمت</th>
<th>وضعیت</th>
<th>قیمت</th>

</tr>

</thead>


<tbody id="list">

<tr>
<td colspan="6">
<div class="loading">
در حال دریافت اطلاعات...
</div>
</td>
</tr>

</tbody>


</table>


</div>



<script>


const API_URL =

"https://hamedgholamzade.app.n8n.cloud/webhook/admin-list";



async function loadData(){


try{


let response = await fetch(API_URL);



let result = await response.json();



console.log("RESULT:", result);
alert(JSON.stringify(result).substring(0,300));

let data = Array.isArray(result) ? result : result.data || [];


let html = "";



if(!data || data.length === 0){

html = `

<tr>

<td colspan="6">

اطلاعاتی موجود نیست

</td>

</tr>

`;

}

else{

data.forEach((item)=>{

html += 

<tr>

<td>${item.tracking_code || ""}</td>

<td>${item.name || ""}</td>

<td>${item.mobile || ""}</td>

<td>${item.service || ""}</td>

<td>${item.status || ""}</td>

<td>${item.price || ""}</td>

</tr>

;

});


}



document.getElementById("list").innerHTML = html;



}

catch(error){


console.log(error);



document.getElementById("list").innerHTML = `

<tr>

<td colspan="6">

خطا در دریافت اطلاعات

</td>

</tr>

`;


}


}



loadData();



</script>


</body>

</html>
