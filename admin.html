<script>

const API_URL =
"https://hamedgholamzade.app.n8n.cloud/webhook/admin-list";


async function loadData(){

try {

let response = await fetch(API_URL);

let result = await response.json();

console.log(result);


// گرفتن اطلاعات از قسمت data
let data = result.data || result;


let html = "";


data.forEach(item => {


html += 

<tr>

<td>${item["tracking_code"] || item["کد پیگیری"] || ""}</td>

<td>${item["نام"] || ""}</td>

<td>${item["موبایل"] || ""}</td>

<td>${item["خدمت"] || ""}</td>

<td>${item["وضعیت"] || ""}</td>

<td>${item["قیمت"] || ""}</td>


</tr>

;


});


document.getElementById("list").innerHTML = html;


}

catch(error){

console.log(error);

document.getElementById("list").innerHTML =


<tr>
<td colspan="6">
خطا در دریافت اطلاعات
</td>
</tr>
;

}


}


loadData();


</script>
