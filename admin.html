<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>پنل مدیریت</title><link rel="stylesheet" href="style.css"></head><body><div class="container"><div id="loginView" class="login-wrap"><div class="login-card"><div class="section-icon">🔐</div><h1>ورود به پنل مدیریت</h1><p class="hint">این بخش فقط برای مدیر است. نام کاربری و رمز عبور توسط Basic Authentication در n8n بررسی می‌شود.</p><div class="field"><label>نام کاربری</label><input id="username" autocomplete="username"></div><div class="field"><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password"></div><div class="actions"><button class="primary" id="loginBtn">ورود</button></div><div id="loginStatus" class="status"></div></div></div><div id="panelView" style="display:none"><div class="topbar"><div><h1>پنل مدیریت درخواست‌ها</h1><span class="badge">دسترسی مدیر</span></div><button class="danger" id="logoutBtn">خروج</button></div><div class="card"><div id="loadStatus" class="status"></div><div class="table-wrap"><table><thead><tr><th>کد پیگیری</th><th>نام</th><th>موبایل</th><th>خدمت</th><th>وضعیت</th><th>قیمت</th><th>پاسخ</th><th>فایل نتیجه</th><th>عملیات</th></tr></thead><tbody id="tableBody"><tr><td colspan="9">در حال دریافت اطلاعات...</td></tr></tbody></table></div><div id="editBox" class="edit-box"><h3>ویرایش درخواست</h3><input type="hidden" id="tracking_code"><div class="field"><label>وضعیت</label><select id="status"><option>جدید</option><option>در حال بررسی</option><option>انجام شد</option><option>رد شد</option></select></div><div class="field"><label>قیمت</label><input id="price" inputmode="numeric"></div><div class="field"><label>پاسخ مدیر</label><textarea id="reply"></textarea></div><div class="field result-upload"><label>فایل نتیجه برای مشتری <span class="muted">(اختیاری؛ بهتر است وضعیت «انجام شد» باشد)</span></label><input id="resultFile" type="file"><div id="currentFile" class="note"></div></div><div class="actions"><button class="primary" id="saveBtn">ذخیره تغییرات</button><button class="secondary" id="cancelBtn">انصراف</button></div><div id="saveStatus" class="status"></div></div></div></div></div><script src="config.js"></script><script>
let auth=sessionStorage.getItem('adminAuth')||'';const loginView=document.getElementById('loginView'),panelView=document.getElementById('panelView'),loginStatus=document.getElementById('loginStatus'),tableBody=document.getElementById('tableBody'),loadStatus=document.getElementById('loadStatus'),editBox=document.getElementById('editBox'),saveStatus=document.getElementById('saveStatus'),saveBtn=document.getElementById('saveBtn');let rows=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function show(el,t,k){el.textContent=t||'';el.className='status '+(k||'')}function headers(){return auth?{Authorization:'Basic '+auth,Accept:'application/json'}:{Accept:'application/json'}}function getCode(x){return String(x?.tracking_code??'').trim()}async function api(url,opt={}){const r=await fetch(url,{cache:'no-store',...opt,headers:{...headers(),...(opt.headers||{})}});const text=await r.text();if(r.status===401)throw Object.assign(new Error('نام کاربری یا رمز عبور صحیح نیست.'),{unauthorized:true});if(!r.ok)throw new Error('HTTP '+r.status+(text?' - '+text:''));let d={};try{d=text?JSON.parse(text):{}}catch(_){throw new Error('پاسخ سرور JSON معتبر نیست.')}return d}async function load(){tableBody.innerHTML='<tr><td colspan="9">در حال دریافت اطلاعات...</td></tr>';try{const d=await api(APP_CONFIG.listApi);rows=Array.isArray(d)?d:(d.data||d.items||[]);if(!rows.length){tableBody.innerHTML='<tr><td colspan="9">درخواستی وجود ندارد.</td></tr>';return}tableBody.innerHTML=rows.map((x,i)=>'<tr><td>'+esc(getCode(x))+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.mobile)+'</td><td>'+esc(x.service)+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.price)+'</td><td>'+esc(x.reply)+'</td><td>'+(x.result_file_url?'<a class="mini-link" target="_blank" rel="noopener" href="'+esc(x.result_file_url)+'">مشاهده</a>':'—')+'</td><td><button class="primary editBtn" data-i="'+i+'">ویرایش</button></td></tr>').join('');show(loadStatus,'تعداد '+rows.length+' درخواست دریافت شد.','ok')}catch(e){tableBody.innerHTML='<tr><td colspan="9">خطا در دریافت اطلاعات.</td></tr>';show(loadStatus,e.message,'err');if(e.unauthorized)logout()}}tableBody.addEventListener('click',e=>{const b=e.target.closest('.editBtn');if(!b)return;const x=rows[+b.dataset.i],c=getCode(x);if(!c){show(saveStatus,'کد پیگیری این ردیف در پاسخ n8n وجود ندارد.','err');return}document.getElementById('tracking_code').value=c;document.getElementById('status').value=x.status||'جدید';document.getElementById('price').value=x.price??'';document.getElementById('reply').value=x.reply??'';document.getElementById('resultFile').value='';document.getElementById('currentFile').innerHTML=x.result_file_url?'<a class="mini-link" target="_blank" rel="noopener" href="'+esc(x.result_file_url)+'">فایل فعلی</a>':'هنوز فایلی برای مشتری ثبت نشده است.';show(saveStatus,'','');editBox.classList.add('show');editBox.scrollIntoView({behavior:'smooth',block:'center'})});document.getElementById('cancelBtn').onclick=()=>editBox.classList.remove('show');saveBtn.onclick=async()=>{const c=document.getElementById('tracking_code').value.trim();if(!c){show(saveStatus,'کد پیگیری وجود ندارد.','err');return}saveBtn.disabled=true;show(saveStatus,'در حال ذخیره تغییرات...','info');try{await api(APP_CONFIG.updateApi,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tracking_code:c,status:document.getElementById('status').value,price:document.getElementById('price').value,reply:document.getElementById('reply').value})});const file=document.getElementById('resultFile').files[0];if(file){show(saveStatus,'اطلاعات ذخیره شد؛ در حال ارسال فایل نتیجه...','info');const fd=new FormData();fd.append('tracking_code',c);fd.append('file',file);const r=await fetch(APP_CONFIG.adminFileApi,{method:'POST',headers:headers(),body:fd});const t=await r.text();if(!r.ok)throw new Error('خطا در ارسال فایل: HTTP '+r.status);let d={};try{d=JSON.parse(t)}catch(_){ }if(!d.success)throw new Error(d.message||'فایل نتیجه ارسال نشد.')}show(saveStatus,'ذخیره و ارسال با موفقیت انجام شد.','ok');editBox.classList.remove('show');await load()}catch(e){show(saveStatus,e.message,'err');if(e.unauthorized)logout()}finally{saveBtn.disabled=false}};function logout(){sessionStorage.removeItem('adminAuth');auth='';panelView.style.display='none';loginView.style.display='flex'}document.getElementById('logoutBtn').onclick=logout;document.getElementById('loginBtn').onclick=async()=>{const u=document.getElementById('username').value,p=document.getElementById('password').value;if(!u||!p){show(loginStatus,'نام کاربری و رمز عبور را وارد کنید.','err');return}const candidate=btoa(unescape(encodeURIComponent(u+':'+p)));try{auth=candidate;await api(APP_CONFIG.listApi);sessionStorage.setItem('adminAuth',auth);loginView.style.display='none';panelView.style.display='block';await load()}catch(e){auth='';show(loginStatus,e.message,'err')}};if(auth){loginView.style.display='none';panelView.style.display='block';load()}document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginBtn').click()});</script></body></html>
