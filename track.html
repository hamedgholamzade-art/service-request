<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پیگیری درخواست</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#f4f6f8;
color:#222;
}

.container{
max-width:600px;
margin:40px auto;
padding:20px;
}

.card{
background:#fff;
border-radius:22px;
padding:30px;
box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.logo{
width:60px;
height:60px;
margin:auto;
background:#18212b;
color:white;
border-radius:18px;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
}

h1{
text-align:center;
font-size:24px;
margin:20px 0;
}

.subtitle{
text-align:center;
color:#777;
line-height:2;
font-size:14px;
}

label{
display:block;
margin-top:20px;
font-weight:bold;
}

input{
width:100%;
padding:14px;
margin-top:8px;
border-radius:12px;
border:1px solid #ddd;
font-family:inherit;
font-size:15px;
}

button{
width:100%;
margin-top:20px;
padding:14px;
border:0;
border-radius:12px;
background:#18212b;
color:white;
font-size:15px;
cursor:pointer;
}

.result{
margin-top:25px;
padding:20px;
background:#f5f7f9;
border-radius:15px;
line-height:2;
display:none;
}

.footer{
text-align:center;
margin-top:20px;
font-size:12px;
color:#888;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
✓
</div>

<h1>
پیگیری درخواست
</h1>

<div class="subtitle">
کد پیگیری خود را وارد کنید
<br>
وضعیت درخواست خود را مشاهده نمایید
</div>


<label>
کد پیگیری
</label>

<input 
id="code"
placeholder="مثال: BRJ-12345678"
>


<button onclick="track()">
مشاهده وضعیت
</button>


<div id="result" class="result">

</div>


<div class="footer">
سامانه ثبت درخواست خدمات
</div>


</div>

</div>


<script>

const params = new URLSearchParams(window.location.search);

const urlCode = params.get("code");


if(urlCode){

document.getElementById("code").value=urlCode;

}


function track(){

let code=document.getElementById("code").value;


let result=document.getElementById("result");


result.style.display="block";


result.innerHTML=
`
<b>کد پیگیری:</b> ${code}
<br><br>

وضعیت درخواست:
<br>

<span style="color:green">
در حال بررسی
</span>

<br><br>

اطلاعات درخواست شما پس از بررسی نمایش داده خواهد شد.
`;

}


</script>


</body>
</html>
