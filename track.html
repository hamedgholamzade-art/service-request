<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>پیگیری درخواست</title>

<style>
body{
    font-family:tahoma;
    background:#f4f6f8;
    padding:30px;
}

.box{
    max-width:450px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 20px #ddd;
}

h2{
    text-align:center;
}

input,button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border-radius:10px;
    border:1px solid #ddd;
    font-size:15px;
}

button{
    background:#18212b;
    color:white;
    cursor:pointer;
}

.result{
    margin-top:20px;
    line-height:2;
}
</style>

</head>

<body>

<div class="box">

<h2>
پیگیری درخواست
</h2>

<input id="code" placeholder="کد پیگیری را وارد کنید">

<button onclick="checkStatus()">
بررسی وضعیت
</button>

<div class="result" id="result"></div>

</div>


<script>

const WEBHOOK_URL =
"https://hamedgholamzade.app.n8n.cloud/webhook-test/track-status";

async function checkStatus(){

let code =
document.getElementById("code").value;


let result =
document.getElementById("result");


result.innerHTML="در حال بررسی...";


try{

let response =
await fetch(
WEBHOOK_URL+"?code="+code
);


let data =
await response.json();


result.innerHTML=
`
<b>کد پیگیری:</b>
${data.tracking_code}
<br>

<b>وضعیت:</b>
${data.status}

<br>

<b>نام:</b>
${data.name}

<br>

<b>خدمت:</b>
${data.service}

<br>

<b>توضیحات:</b>
${data.reply || ""}
`;

}
catch(e){

result.innerHTML=
"خطا در دریافت اطلاعات";

}

}

</script>


</body>
</html>
