<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پیگیری درخواست</title><link rel="stylesheet" href="style.css"></head><body><div class="container"><div class="card"><h2>🔎 پیگیری درخواست</h2><input id="code" placeholder="کد پیگیری"><button class="btn" onclick="go()">پیگیری درخواست</button><div id="r"></div></div></div><script src="config.js"></script><script>const q=new URLSearchParams(location.search);if(q.get("code"))code.value=q.get("code");async function go(){try{const x=await fetch(APP_CONFIG.trackApi+"?tracking_code="+encodeURIComponent(code.value.trim()));const j=await x.json();if(!j.found)throw Error(j.message||"درخواستی با این کد پیدا نشد.");const d=j.data||j;r.innerHTML='<div class="result"><b>کد:</b> '+d.tracking_code+'<br><b>وضعیت:</b> '+(d.status||"")+'<br><b>قیمت:</b> '+(d.price||"")+'<br><b>پاسخ مدیر:</b> '+(d.reply||"")+(d.result_file_url?'<br><br><a class="btn green" target="_blank" href="'+d.result_file_url+'">دانلود فایل نتیجه</a>':"")+'</div>'}catch(e){r.innerHTML='<div class="result">'+e.message+'</div>'}}</script></body></html>
