<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>پیگیری درخواست</title><link rel="stylesheet" href="style.css"></head><body><div class="container"><div class="ad"><div class="ad-title">خدمات آنلاین حامد غلامزاده</div><div class="ad-grid"><div><div class="ad-label">تماس</div><div class="phone">۰۹۳۷۱۴۳۱۹۱۵</div></div><div><div class="ad-label">آدرس</div><div>بیرجند، خیابان پاسداران</div></div></div><p>۱۰ سال سابقه در ارائه خدمات اداری، پیشخوان دولت و سامانه‌های تخصصی</p></div><div class="card"><div class="header"><h1>پیگیری درخواست</h1><p>کد پیگیری همان درخواست را وارد کنید.</p></div><div class="field"><label>کد پیگیری</label><input id="code" placeholder="BRJ-12345678" autocomplete="off"></div><div class="actions"><button id="searchBtn" class="primary">پیگیری</button></div><div id="result" class="result-card"></div></div></div><script src="config.js"></script><script>
const code=document.getElementById('code'),result=document.getElementById('result'),btn=document.getElementById('searchBtn');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function show(t,k){result.textContent=t||'';result.className='result-card '+(k||'')}async function go(){const c=code.value.trim();if(!c){show('کد پیگیری را وارد کنید.','err');return}btn.disabled=true;show('در حال دریافت اطلاعات...','info');try{const r=await fetch(APP_CONFIG.trackApi+'?code='+encodeURIComponent(c),{cache:'no-store',headers:{Accept:'application/json'}});const t=await r.text();if(!r.ok)throw new Error('HTTP '+r.status);const d=JSON.parse(t);if(!d.found){show(d.message||'درخواستی با این کد پیدا نشد.','err');return}const file=d.result_file_url?'<a class="download-btn" href="'+esc(d.result_file_url)+'" target="_blank" rel="noopener">دانلود فایل نتیجه</a>':'<span class="muted">فایلی برای دانلود ثبت نشده است.</span>';result.className='result-card ok';result.innerHTML='<div class="result-code">'+esc(d.tracking_code||c)+'</div><div class="info-grid"><div><span>خدمت</span><strong>'+esc(d.service)+'</strong></div><div><span>وضعیت</span><strong>'+esc(d.status||'')+'</strong></div><div><span>قیمت</span><strong>'+esc(d.price||'')+'</strong></div><div class="full"><span>پاسخ مدیر</span><strong>'+esc(d.reply||'')+'</strong></div></div><div class="result-file"><span>فایل نتیجه</span>'+file+'</div>'}catch(e){show('خطا در پیگیری: '+e.message,'err')}finally{btn.disabled=false}}btn.onclick=go;code.addEventListener('keydown',e=>{if(e.key==='Enter')go()});const p=new URLSearchParams(location.search);if(p.get('code')){code.value=p.get('code');go()}</script></body></html>
