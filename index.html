<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خدمات آنلاین حامد غلامزاده</title><link rel="stylesheet" href="style.css"></head><body><div class="container">
<div class="card"><h1>خدمات آنلاین حامد غلامزاده</h1><p>۱۰ سال سابقه خدمات اداری، پیشخوان دولت و سامانه‌های تخصصی</p><p>📞 ۰۹۳۷۱۴۳۱۹۱۵</p><p>📍 بیرجند، خیابان پاسداران</p></div>
<div class="card"><h2>ثبت درخواست</h2><input id="name" placeholder="نام و نام خانوادگی"><input id="mobile" placeholder="شماره موبایل"><input id="city" placeholder="شهر"><input id="service" placeholder="خدمت مورد نظر"><textarea id="description" placeholder="توضیحات"></textarea><label>فایل‌های پیوست (اختیاری، حداکثر ۵ فایل)</label><input id="files" type="file" multiple><button class="btn green" onclick="submitRequest()">ثبت درخواست</button><div id="msg" class="notice" style="margin-top:15px"></div></div>
<div class="card"><h2>پیگیری و بازیابی</h2><p>برای پیگیری درخواست یا پیدا کردن کد پیگیری خود، گزینه مناسب را انتخاب کنید.</p><div class="quick"><a class="btn" href="track.html">🔎 پیگیری درخواست</a><a class="btn green" href="recover.html">🆔 بازیابی کد پیگیری</a></div></div></div>
<script src="config.js"></script><script>async function submitRequest(){const f=new FormData();["name","mobile","city","service","description"].forEach(x=>f.append(x,document.getElementById(x).value));[...document.getElementById("files").files].slice(0,5).forEach((x,i)=>f.append("file"+(i+1),x));const m=document.getElementById("msg");m.textContent="در حال ثبت...";try{const r=await fetch(APP_CONFIG.requestApi,{method:"POST",body:f});const j=await r.json();if(!r.ok||j.ok===false)throw Error(j.message||"خطا");m.innerHTML="درخواست ثبت شد.<br>کد پیگیری: <b>"+(j.tracking_code||"")+"</b>"}catch(e){m.textContent="خطا: "+e.message}}</script></body></html>
